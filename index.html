<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MyPatientHUB</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="top-section">
      <div class="welcome">
        <h1>Welcome to MyPatientHUB!</h1>
        <p>We provide smart healthcare services in your hands.</p>
      </div>
      <div class="login-box">
        <h2>Sign in to MyPatientHUB</h2>

        <div class="social-buttons">
          <button id="facebook">f</button>
          <button id="google">G</button>
        </div>

        <!-- Login form -->
        <form id="loginForm">
          <input type="text" id="email" placeholder="Email or Phone number" />

          <input
            type="password"
            id="password"
            placeholder="Please enter your password"
          />

          <button type="submit" class="sign-in">
            <a href="m/inex.html">SIGN IN</a>
          </button>
        </form>

        <div class="options">
          <a href="#" id="forgot">Forgot password?</a>

          <label>
            <input type="checkbox" id="remember" />
            Remember me
          </label>
        </div>

        <div class="or">
          <span>or</span>
        </div>

        <button class="sign-up" id="signUp">SIGN UP</button>
      </div>
    </div>

    <!-- Footer -->
    <footer>
      <a href="#">Google Play Store APP</a>
      <a href="#">App Store APP</a>
      <a href="#">About MyPatientHUB</a>
      <a href="#">About Us</a>
      <a href="#">Our Blog</a>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
